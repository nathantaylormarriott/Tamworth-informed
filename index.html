  <style>
    :root {
      --paper: #f3eee6;
      --ink: #241e18;
      --body: #4e463d;
      --quiet: #6a6156;
      --line: #e0d8cc;
      --field: #fffcf8;
      --field-border: #d5cdc0;
      --accent: #0c4d78;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: Quicksand, "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
      padding: 2.75rem 1.35rem 3.5rem;
    }

    main {
      width: min(34rem, 100%);
      margin: 0 auto;
    }

    .masthead,
    .intro {
      text-align: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
    }

    .intro h1 { order: 1; }
    .intro .group { order: 2; width: 100%; }
    .intro .lede { order: 3; }

    .logo {
      display: block;
      width: 100%;
      max-width: 22rem;
      height: auto;
      margin: 0 auto 1.85rem;
      filter: drop-shadow(0 8px 14px rgb(0 0 0 / 0.45)) drop-shadow(0 2px 3px rgb(0 0 0 / 0.35));
    }

    h1 {
      margin: 0.85rem auto 0;
      max-width: 16em;
      font-size: clamp(1.9rem, 1.15rem + 2.5vw, 2.7rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    .lede {
      margin: 1rem auto 0;
      max-width: 28em;
      color: var(--body);
      font-size: 1.125rem;
      line-height: 1.5;
      text-wrap: balance;
    }

    .contact {
      margin-top: 2.75rem;
      padding-top: 1.85rem;
    }

    .contact h2 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .contact-form {
      display: grid;
      gap: 1rem;
      margin-top: 1.35rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.3rem;
    }

    .req {
      color: #9a3412;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 0.75rem 0.8rem;
      border: 1px solid var(--field-border);
      border-radius: var(--radius);
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #8a8176;
    }

    .field input:focus-visible,
    .field textarea:focus-visible,
    .contact-form button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .field textarea {
      min-height: 8rem;
      resize: vertical;
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .contact-form button {
      margin-top: 0.25rem;
      font: inherit;
    }

    .group {
      margin-top: 1.75rem;
      text-align: center;
    }

    .highlights {
      display: grid;
      gap: 0.65rem;
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
    }

    .highlights li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--field);
      text-align: left;
    }

    .stat {
      color: var(--ink);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .stat-label {
      color: var(--quiet);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: right;
    }

    .group-link,
    .contact-form button,
    .contact-mail {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.2rem;
      border: 0;
      border-radius: var(--radius);
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
    }

    .group-link {
      overflow: hidden;
      isolation: isolate;
      background: #1877f2;
      box-shadow: 0 2px 8px rgb(7 20 34 / 0.22), 0 6px 18px rgb(24 119 242 / 0.35);
      animation: cta-pulse 2.4s ease-in-out infinite;
    }

    .contact-form button {
      background: #1877f2;
      box-shadow: 0 2px 8px rgb(7 20 34 / 0.18);
    }

    .contact-mail {
      background: #6e93b8;
      box-shadow: 0 2px 8px rgb(7 20 34 / 0.14);
    }

    .contact-mail .cta-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .mail-icon {
      width: 1.15rem;
      height: 1.15rem;
      flex: none;
    }

    .group-link:hover,
    .contact-form button:hover,
    .contact-mail:hover {
      filter: brightness(1.04);
    }

    .group-link:focus-visible,
    .contact-form button:focus-visible {
      outline: 2px solid #1877f2;
      outline-offset: 2px;
    }

    .contact-mail:focus-visible {
      outline: 2px solid #6e93b8;
      outline-offset: 2px;
    }

    .cta-label {
      position: relative;
      z-index: 1;
    }

    .cta-shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(
        -75deg,
        transparent calc(var(--x) + 0%),
        rgb(255 255 255 / 0.35) calc(var(--x) + 15%),
        rgb(255 255 255 / 0.35) calc(var(--x) + 22%),
        transparent calc(var(--x) + 45%)
      );
      animation: cta-shine 2.8s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    }

    @keyframes cta-shine {
      0% { --x: 100%; }
      55% { --x: -100%; }
      100% { --x: -100%; }
    }

    @keyframes cta-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @property --x {
      syntax: "<percentage>";
      inherits: false;
      initial-value: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      .group-link,
      .cta-shine {
        animation: none;
      }
    }

    @media (max-width: 959px) {
      html {
        background: #14110e;
      }

      body {
        --ink: #f7f4ee;
        --body: #efe8dc;
        --quiet: #e4dccf;
        --line: rgba(255, 255, 255, 0.32);
        color: var(--ink);
        background: transparent;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #14110e;
        background-image:
          linear-gradient(180deg, rgba(16, 12, 9, 0.62), rgba(16, 12, 9, 0.72)),
          url("tamworth-informed-mobile-hero.webp");
        background-position: center top;
        background-size: cover;
        background-repeat: no-repeat;
      }

      .highlights li,
      .field input,
      .field textarea,
      .stat {
        color: #241e18;
      }

      .stat-label {
        color: #5c564c;
      }

      .req {
        color: #ffd0b8;
      }

      .field input::placeholder,
      .field textarea::placeholder {
        color: #8a8176;
      }
    }

    @media (min-width: 960px) {
      body {
        --ink: #f7f4ee;
        --body: #efe8dc;
        --quiet: #e4dccf;
        --line: rgba(255, 255, 255, 0.32);
        --field: #fffcf8;
        --field-border: #d9d0c4;
        display: flex;
        align-items: safe center;
        justify-content: center;
        padding: 3rem 4.5rem;
        color: var(--ink);
        background-color: #14110e;
        background-image:
          linear-gradient(180deg, rgba(16, 12, 9, 0.62), rgba(16, 12, 9, 0.72)),
          url("tamworth-informed-desktop-hero.webp");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      .highlights li,
      .field input,
      .field textarea {
        color: #241e18;
      }

      .req {
        color: #ffd0b8;
      }

      .stat {
        color: #241e18;
      }

      .stat-label {
        color: #5c564c;
      }

      .field input::placeholder,
      .field textarea::placeholder {
        color: #8a8176;
      }

      main {
        width: min(68rem, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(20rem, 0.85fr);
        column-gap: 4.5rem;
        align-items: start;
      }

      .masthead {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        text-align: center;
        margin-bottom: 2.5rem;
        padding-bottom: 1.35rem;
      }

      .logo {
        width: 28rem;
        max-width: none;
        margin: 0 auto;
      }

      .intro {
        text-align: left;
        padding-top: 0.35rem;
      }

      .intro h1 { order: 1; }
      .intro .lede { order: 2; }
      .intro .group { order: 3; }

      h1 {
        margin: 0;
        max-width: 14em;
        font-size: 3.15rem;
        line-height: 1.12;
        text-align: left;
      }

      .lede {
        margin: 1.15rem 0 0;
        max-width: 36em;
        font-size: 1.2rem;
        text-align: left;
      }

      .group {
        margin-top: 2rem;
        text-align: left;
      }

      .highlights {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .highlights li {
        display: block;
        min-height: 6.25rem;
        padding: 0.9rem 0.8rem;
      }

      .stat {
        display: block;
        font-size: 1.2rem;
      }

      .stat-label {
        display: block;
        margin-top: 0.35rem;
        text-align: left;
      }

      .group-link {
        width: auto;
        padding-inline: 1.4rem;
      }

      .contact {
        margin: 0;
        padding: 0.35rem 0 0 3.25rem;
      }

      .contact h2 {
        font-size: 2rem;
      }

      .contact-form {
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem 1rem;
      }

      .field-email,
      .field-message {
        grid-column: 1 / -1;
      }

      .field textarea {
        min-height: 7.5rem;
      }

      .contact-form button,
      .contact-mail {
        width: auto;
        justify-self: start;
        padding-inline: 1.4rem;
        margin-top: 0.35rem;
      }

      .contact-form button {
        grid-column: 1;
      }

      .contact-mail {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <img
        class="logo"
        src="tamworth-informed-logo.webp?v=4"
        alt="Tamworth Informed"
        width="1800"
        height="657"
      >
    </header>
    <div class="intro">
      <h1>Tamworth’s digital community hub, coming soon!</h1>
      <p class="lede">Connecting residents, local businesses, tradespeople and employers.</p>
      <section class="group" aria-label="Facebook group">
        <ul class="highlights">
          <li>
            <span class="stat">Over 47,000</span>
            <span class="stat-label">members</span>
          </li>
          <li>
            <span class="stat">Over 2 million</span>
            <span class="stat-label">in reach</span>
          </li>
          <li>
            <span class="stat">Available</span>
            <span class="stat-label">Business opportunities</span>
          </li>
        </ul>
        <a class="group-link" href="https://www.facebook.com/groups/560283727406222" target="_blank" rel="noopener noreferrer me"><span class="cta-label">Join the Facebook group</span><span class="cta-shine" aria-hidden="true"></span></a>
      </section>
    </div>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in touch</h2>
      <form
        class="contact-form"
        name="contact"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
        action="/"
      >
        <input type="hidden" name="form-name" value="contact">
        <p class="hp" aria-hidden="true">
          <label>Don’t fill this out: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
        </p>
        <div class="field">
          <label for="contact-name">Name <span class="req" aria-hidden="true">*</span></label>
          <input id="contact-name" type="text" name="name" autocomplete="name" required maxlength="120" placeholder="Your name">
        </div>
        <div class="field">
          <label for="contact-phone">Telephone</label>
          <input id="contact-phone" type="tel" name="phone" autocomplete="tel" maxlength="30" placeholder="Phone number">
        </div>
        <div class="field field-email">
          <label for="contact-email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="contact-email" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        </div>
        <div class="field field-message">
          <label for="contact-message">Message <span class="req" aria-hidden="true">*</span></label>
          <textarea id="contact-message" name="message" required maxlength="2000" placeholder="How can we help?"></textarea>
        </div>
        <button type="submit">Send message</button>
        <a class="contact-mail" href="mailto:office@tamworthinformed.com"><span class="cta-label">Email us<svg class="mail-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m21.854 2.147-10.94 10.939"/></svg></span></a>
      </form>
    </section>
  </main>
</body>
</html>
