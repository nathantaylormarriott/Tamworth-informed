<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tamworth Informed is a community hub for Tamworth, Staffordshire. Coming soon.">
  <meta name="theme-color" content="#f3eee6">
  <title>Tamworth Informed — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3eee6;
      --ink: #241e18;
      --body: #4e463d;
      --quiet: #6a6156;
      --line: #e0d8cc;
      --field: #fffcf8;
      --field-border: #d5cdc0;
      --accent: #0c4d78;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: Quicksand, "Avenir Next", "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
      padding: 2.75rem 1.35rem 3.5rem;
    }

    main {
      width: min(34rem, 100%);
      margin: 0 auto;
    }

    .masthead,
    .intro {
      text-align: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
    }

    .intro h1 { order: 1; }
    .intro .group { order: 2; width: 100%; }
    .intro .lede { order: 3; }

    .logo {
      display: block;
      width: 100%;
      max-width: 22rem;
      height: auto;
      margin: 0 auto 1.85rem;
    }

    h1 {
      margin: 0.85rem auto 0;
      max-width: 16em;
      font-size: clamp(1.9rem, 1.15rem + 2.5vw, 2.7rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }

    .lede {
      margin: 1rem auto 0;
      max-width: 28em;
      color: var(--body);
      font-size: 1.125rem;
      line-height: 1.5;
      text-wrap: balance;
    }

    .contact {
      margin-top: 2.75rem;
      padding-top: 1.85rem;
      border-top: 1px solid var(--line);
    }

    .contact h2 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .contact-note {
      margin: 0.4rem 0 1.35rem;
      color: var(--body);
    }

    .contact-form {
      display: grid;
      gap: 1rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.3rem;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 0.75rem 0.8rem;
      border: 1px solid var(--field-border);
      border-radius: var(--radius);
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #8a8176;
    }

    .field input:focus-visible,
    .field textarea:focus-visible,
    .contact-form button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .field textarea {
      min-height: 8rem;
      resize: vertical;
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .contact-form button {
      margin-top: 0.25rem;
      width: 100%;
      padding: 0.85rem 1.1rem;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      cursor: pointer;
    }

    .contact-form button:hover {
      background: #0a4266;
    }

    .group {
      margin-top: 1.75rem;
      text-align: center;
    }

    .highlights {
      display: grid;
      gap: 0.65rem;
      list-style: none;
      margin: 0 0 1rem;
      padding: 0;
    }

    .highlights li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--field);
      text-align: left;
    }

    .stat {
      color: var(--ink);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .stat-label {
      color: var(--quiet);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: right;
    }

    .group-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: var(--radius);
      background: #1877f2;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .group-link:hover {
      background: #0f67d8;
    }

    .group-link:focus-visible {
      outline: 2px solid #1877f2;
      outline-offset: 2px;
    }

    @media (min-width: 960px) {
      body {
        display: flex;
        align-items: safe center;
        justify-content: center;
        padding: 3rem 4.5rem;
      }

      main {
        width: min(68rem, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(20rem, 0.85fr);
        column-gap: 4.5rem;
        align-items: start;
      }

      .masthead {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        text-align: center;
        margin-bottom: 2.5rem;
        padding-bottom: 1.35rem;
        border-bottom: 1px solid var(--line);
      }

      .logo {
        width: 28rem;
        max-width: none;
        margin: 0 auto;
      }

      .intro {
        text-align: left;
        padding-top: 0.35rem;
      }

      .intro h1 { order: 1; }
      .intro .lede { order: 2; }
      .intro .group { order: 3; }

      h1 {
        margin: 0;
        max-width: 14em;
        font-size: 3.15rem;
        line-height: 1.12;
        text-align: left;
      }

      .lede {
        margin: 1.15rem 0 0;
        max-width: 36em;
        font-size: 1.2rem;
        text-align: left;
      }

      .group {
        margin-top: 2rem;
        text-align: left;
      }

      .highlights {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .highlights li {
        display: block;
        min-height: 6.25rem;
        padding: 0.9rem 0.8rem;
      }

      .stat {
        display: block;
        font-size: 1.2rem;
      }

      .stat-label {
        display: block;
        margin-top: 0.35rem;
        text-align: left;
      }

      .group-link {
        width: auto;
        padding-inline: 1.4rem;
      }

      .contact {
        margin: 0;
        padding: 0.35rem 0 0 3.25rem;
        border-top: 0;
        border-left: 1px solid var(--line);
      }

      .contact h2 {
        font-size: 2rem;
      }

      .contact-form {
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem 1rem;
      }

      .field-message,
      .contact-form button {
        grid-column: 1 / -1;
      }

      .field textarea {
        min-height: 7.5rem;
      }

      .contact-form button {
        width: auto;
        justify-self: start;
        margin-top: 0.35rem;
        padding-inline: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <img
        class="logo"
        src="tamworth-informed-logo.png"
        alt="Tamworth Informed"
        width="300"
        height="100"
      >
    </header>
    <div class="intro">
      <h1>Tamworth’s digital community hub, coming soon!</h1>
      <p class="lede">Connecting residents, local businesses, tradespeople and employers.</p>
      <section class="group" aria-label="Facebook group">
        <ul class="highlights">
          <li>
            <span class="stat">Over 47,000</span>
            <span class="stat-label">members</span>
          </li>
          <li>
            <span class="stat">Over 2 million</span>
            <span class="stat-label">in reach</span>
          </li>
          <li>
            <span class="stat">Available</span>
            <span class="stat-label">Business opportunities</span>
          </li>
        </ul>
        <a class="group-link" href="https://www.facebook.com/groups/560283727406222" target="_blank" rel="noopener noreferrer">Join the Facebook group</a>
      </section>
    </div>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Get in touch</h2>
      <p class="contact-note">Questions, or want to be involved? Send a message.</p>
      <form
        class="contact-form"
        name="contact"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
        action="/"
      >
        <input type="hidden" name="form-name" value="contact">
        <p class="hp" aria-hidden="true">
          <label>Don’t fill this out: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
        </p>
        <div class="field">
          <label for="contact-name">Name</label>
          <input id="contact-name" type="text" name="name" autocomplete="name" required maxlength="120" placeholder="Your name">
        </div>
        <div class="field">
          <label for="contact-email">Email</label>
          <input id="contact-email" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        </div>
        <div class="field field-message">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" required maxlength="2000" placeholder="How can we help?"></textarea>
        </div>
        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
</body>
</html>
